sonar.projectKey=arckium-tickets-backend
sonar.projectName=Arckium Tickets Backend
sonar.projectVersion=1.0

sonar.sources=src
sonar.tests=src
sonar.sourceEncoding=UTF-8

sonar.test.inclusions=**/*.spec.ts
sonar.exclusions=**/*.spec.ts,**/main.ts,**/*.module.ts

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

sonar.coverage.exclusions=**/*.spec.ts,**/main.ts,**/*.module.ts,**/dto/**
