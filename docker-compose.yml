# Déploiement Docker Compose (utilisé par Jenkins sur la VM)
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"

  backend:
    image: ${BACKEND_IMAGE:-docker.io/feresadouani10/tickets-backend:latest}
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/tickets}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      FRONTEND_URL: ${FRONTEND_URL:-http://192.168.56.10}
    ports:
      - "3000:3000"

  frontend:
    image: ${FRONTEND_IMAGE:-docker.io/feresadouani10/tickets-frontend:latest}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  mongo_data:
