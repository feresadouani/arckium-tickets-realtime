apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: arckium
  labels:
    app: tickets-backend
type: Opaque
# Remplacer avant apply :
#   kubectl -n arckium create secret generic backend-secrets \
#     --from-literal=JWT_SECRET='votre-secret-fort' \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# Ou encoder : echo -n 'votre-secret-fort' | base64
stringData:
  JWT_SECRET: "REPLACE_WITH_A_STRONG_SECRET"
